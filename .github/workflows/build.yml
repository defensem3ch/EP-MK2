name: build

# Windows and macOS builds are the whole point of this file: VST3, AU and CLAP
# all have to be compiled on the platform they run on, so there is no way to
# produce them from the Linux machine this is developed on.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A push that supersedes an earlier one cancels it.  Four runs of a
# three-platform matrix were queued at once on the first day, and macOS
# minutes bill at ten times Linux.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not cancel the others: when a build breaks
      # it is usually platform-specific, and seeing which ones survived is
      # most of the diagnosis.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-14
            name: macos

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # JUCE needs these to build anything with a GUI on Linux, and the list
      # is unforgiving: a missing one fails deep in a JUCE header rather than
      # at configure time.
      - name: Linux dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libxi-dev libxtst-dev \
            libglu1-mesa-dev mesa-common-dev \
            libcurl4-openssl-dev xvfb ninja-build

      - name: Configure
        shell: bash
        # Built as an array rather than interpolated into one line, because
        # the macOS architecture list contains a semicolon: unquoted, the
        # shell reads it as a command separator and tries to run "x86_64",
        # which is an exit code 127 a long way from its cause.
        #
        # Universal because an Apple Silicon runner would otherwise produce an
        # arm64-only plugin, which will not load in an Intel host.
        run: |
          set -euo pipefail
          args=(-S . -B build -DCMAKE_BUILD_TYPE=Release)
          case "${{ matrix.name }}" in
            macos) args+=("-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64") ;;
            linux) args+=(-G Ninja) ;;
          esac
          cmake "${args[@]}"

      - name: Build
        run: cmake --build build --config Release --parallel 4

      # The editor tests need a display.  The Windows and macOS runners have
      # one; Linux does not, hence xvfb.
      #
      # Loading the built .clap is a different claim from producing it, and it
      # is the one that fails when a wrapper is wired up wrong on a platform
      # nobody has built on before.
      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          # Case-insensitive, and ? for the separator, because the binaries are
          # not consistently named: juce_add_console_app's PRODUCT_NAME names
          # the artefact *folder* and leaves the executable as the target name,
          # so EPMK2_tests sits next to epmk2-scaletest.  A case-sensitive
          # pattern found neither and handed the shell an empty string, which
          # is an exit code 127 that says nothing about which tool was missing.
          #
          # .dSYM is excluded because macOS puts a file of the same name inside
          # the debug bundle, and that one is not the executable.
          # Exact names, with an optional .exe -- never a trailing wildcard.
          # A build tree is full of files named after the executable and next
          # to it: EPMK2_tests.entitlements on macOS, epmk2-scaletest.exe.recipe
          # on Windows.  A trailing * matched those and the script then tried
          # to *run* them, which is a permission error on one platform and a
          # shell syntax error on the other, neither of which mentions the
          # actual mistake.
          find_tool() {
            local base=$1 found
            for name in "$base" "$base.exe"; do
              found=$(find build -type f -iname "$name" ! -path '*.dSYM*' | head -1)
              if [ -n "$found" ]; then
                echo "$found"
                return 0
              fi
            done
            echo "no executable called $base or $base.exe under build/" >&2
            find build -type f -iname 'epmk2*' ! -name '*.o' ! -name '*.obj' >&2
            return 1
          }
          if [ "${{ matrix.name }}" = "linux" ]; then
            run() { xvfb-run -a "$@"; }
          else
            run() { "$@"; }
          fi

          run "$(find_tool 'epmk2?tests')"
          "$(find_tool 'epmk2?scaletest')"
          "$(find_tool 'epmk2?claptest')" "$(find build -name 'EP-MK2.clap' | head -1)"

      - name: Stage
        run: cmake --install build --config Release --prefix dist --component dist

      - uses: actions/upload-artifact@v4
        with:
          name: EP-MK2-${{ matrix.name }}
          path: dist/
          if-no-files-found: error
